name: Feature request
description: Propose a model, feature, metric or serving change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or question this answers
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: evaluation
    attributes:
      label: How we will know it helped
      description: The offline metric that should move, and on which split.
